name: Disprove LeetCode (MySQL)

on:
  push:
    branches: ["dev", "main"]
  workflow_dispatch:

env:
  # Pairs per job: small enough that a job of slow problems ends well within the job time limit.
  SHARD_SIZE: 500

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      starts: ${{ steps.shards.outputs.starts }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Shard the dataset
        id: shards
        run: |
          lines=$(wc -l < data/mysql/leetcode.jsonlines)
          echo "starts=$(python3 -c "import json; print(json.dumps(list(range(0, $lines, $SHARD_SIZE))))")" >> "$GITHUB_OUTPUT"

  mysql-experiment:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        start: ${{ fromJSON(needs.plan.outputs.starts) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Every check creates and drops a scratch database, so DDL dominates
      # MySQL's share of the run. A service container cannot take server
      # options; this one keeps its data in memory and does not sync to disk.
      - name: Start MySQL
        run: |
          docker run -d --name mysql -p 3306:3306 \
            --tmpfs /var/lib/mysql:rw,size=4g \
            -e MYSQL_ROOT_PASSWORD=rootpass -e MYSQL_DATABASE=mydb \
            mysql:8.0 \
            --disable-log-bin \
            --innodb-flush-log-at-trx-commit=0 \
            --innodb-doublewrite=OFF \
            --innodb-buffer-pool-size=1G \
            --skip-name-resolve

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: pip install uv

      - name: Install MySQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y mysql-client

      - name: Wait for MySQL
        run: |
          for i in {1..60}; do
            if mysqladmin ping -h 127.0.0.1 -P 3306 -uroot -prootpass --silent; then
              echo "MySQL is ready"
              exit 0
            fi
            echo "Waiting for MySQL..."
            sleep 2
          done
          echo "MySQL did not become ready"
          docker logs mysql
          exit 1

      - name: Install dependencies
        run: uv sync

      # One worker per vCPU: generation is CPU-bound and its time limit is
      # wall-clock, so more workers than cores turn slow pairs into timeouts.
      - name: Run disprove_leetcode
        env:
          PYTHONUNBUFFERED: "1"
          PYTHONIOENCODING: "utf-8"
          MYSQL_CONNECTION_STRING: mysql+pymysql://root:rootpass@127.0.0.1:3306/mydb
        run: |
          source .venv/bin/activate

          python -u scripts/disprove_leetcode.py \
            --connection-string "$MYSQL_CONNECTION_STRING" \
            --output "results/disprove-leetcode-${{ matrix.start }}.jsonl" \
            --start "${{ matrix.start }}" \
            --limit "$SHARD_SIZE" \
            --workers "$(nproc)" \
            --case-timeout-s 60

      - name: Publish metrics summary
        if: always()
        run: |
          summary="results/disprove-leetcode-${{ matrix.start }}.summary.json"
          if [ ! -f "$summary" ]; then
            echo "No LeetCode summary was produced." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "## LeetCode (MySQL) disprove, pairs from ${{ matrix.start }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat "$summary" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload results as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mysql-experiment-results-${{ matrix.start }}
          path: results/
          if-no-files-found: warn
