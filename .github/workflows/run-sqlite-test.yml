name: Disprove BIRD-dev (SQLite)

on:
  push:
    branches: ["dev", "main"]
  workflow_dispatch:

jobs:
  sqlite-experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync

      - name: Run disprove_bird
        env:
          PYTHONUNBUFFERED: "1"
          PYTHONIOENCODING: "utf-8"
        run: |
          source .venv/bin/activate
          python -u scripts/disprove_bird.py \
            --output results/disprove-bird.jsonl \
            --limit 0 \
            --workers 8

      - name: Publish metrics summary
        if: always()
        run: |
          summary="results/disprove-bird.summary.json"
          if [ ! -f "$summary" ]; then
            echo "No BIRD summary was produced." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "## BIRD-dev (SQLite) disprove" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat "$summary" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload results as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sqlite-experiment-results
          path: results/
