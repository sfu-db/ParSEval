[project]
name = "parseval"
version = "1.0.0"
description = "Plan-aware Test Database Generation for SQL Equivalence Evaluation"
authors = [
    { name = "cchen", email = "stuchunyu@gmail.com" }
]
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache 2.0" }

dependencies = [
    "sqlglot==23.12.1",
    "sqlalchemy>=2.0.43,<3.0.0",
    "z3-solver>=4.16.0.0",
    # Drivers SQLAlchemy loads for mysql+pymysql:// and postgresql:// backends.
    "pymysql>=1.2.0",
    "psycopg2-binary>=2.9.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/parseval"]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
]
